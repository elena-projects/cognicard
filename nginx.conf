server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin proxy for Gemini: the browser calls /v1beta/... on our domain
    # (reachable everywhere), and we forward to Google server-side. The API key is
    # INJECTED here from the GEMINI_API_KEY env var — the browser never sees the real key.
    location /v1beta/ {
        # Anti-abuse: only serve requests referred from our own app, so nobody can use
        # this domain as an open relay to burn the injected Gemini key's quota.
        valid_referers cognicard.elenaprojects.cc;
        if ($invalid_referer) { return 403; }
        resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
        set $gemini_host generativelanguage.googleapis.com;
        proxy_pass https://$gemini_host$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_name generativelanguage.googleapis.com;
        proxy_set_header Host generativelanguage.googleapis.com;
        proxy_set_header x-goog-api-key "${GEMINI_API_KEY}";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 15s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Long cache for hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, so a new deploy (with new hashed asset names)
    # is picked up immediately instead of the browser reusing a stale bundle reference.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # SPA fallback: any unknown path serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
